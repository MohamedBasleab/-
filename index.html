<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حلقات غراس - برنامج الفصل الأول</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#faf4ea;--card:#fffdf8;--ink:#3b1a1e;--mut:#7a6660;--line:#eadcc6;--pri:#6a1420;--onpri:#fff;--pri2:#f5e9d3;--gold:#a9740f;--gold2:#fbf0d3;--off:#efe7da;--blue:#8a4b2a;--blue2:#f3e2d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1214;--card:#291b1e;--ink:#f4e9dc;--mut:#b9a49b;--line:#43302f;--pri:#e3b04b;--onpri:#2a1214;--pri2:#3a2528;--gold:#e8b84a;--gold2:#3a2c16;--off:#2c2022;--blue:#e0a07a;--blue2:#3c2a22}}
:root[data-theme="light"]{--bg:#1c1214;--card:#291b1e;--ink:#f4e9dc;--mut:#b9a49b;--line:#43302f;--pri:#e3b04b;--onpri:#2a1214;--pri2:#3a2528;--gold:#e8b84a;--gold2:#3a2c16;--off:#2c2022;--blue:#e0a07a;--blue2:#3c2a22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,'DejaVu Sans',sans-serif;line-height:1.7;font-size:16px}

.band{background:#fbf4ea;border-bottom:3px solid #c48a2c;display:flex;justify-content:space-between;align-items:center;padding:12px max(18px,calc((100% - 900px)/2))}
.band img{height:68px;width:auto;display:block}
header{padding:28px 18px 8px;max-width:900px;margin:auto}
p.brand{margin:0 0 4px;color:var(--pri);font-weight:800;font-size:20px}
h1{font-size:clamp(30px,7vw,46px);font-weight:800;margin:0;line-height:1.2}
.sub{color:var(--mut);margin:4px 0 0}
.next{margin:18px 0 0;background:var(--pri);color:var(--onpri);border-radius:14px;padding:14px 18px}
.next small{opacity:.85;display:block}.next b{font-size:22px;display:block}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
nav div{max-width:900px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:8px 18px}
nav button{flex:none;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:99px;cursor:pointer}
nav button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:900px;margin:auto;padding:16px 18px 48px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 12px;font-size:14px}
.act{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.act.off{background:var(--off);color:var(--mut)}
.act.quran{border-color:var(--gold);background:var(--gold2)}
.dt{flex:none;width:64px;text-align:center;border-left:1px solid var(--line);padding-left:12px}
.dt b{display:block;font-size:26px;line-height:1.1}.dt small{color:var(--mut)}
.wkb{display:inline-block;background:var(--pri);color:var(--onpri);font-weight:800;border-radius:6px;padding:0 12px;font-size:16px;margin-bottom:4px}
.act h3{margin:0;font-size:18px}.act p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;background:var(--blue2);color:var(--blue);margin-top:4px}
.brk{text-align:center;color:var(--gold);border:1px dashed var(--gold);border-radius:10px;padding:8px;margin:12px 0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wk h3{margin:0;padding:8px 14px;background:var(--pri2);color:var(--pri);font-size:16px}
.d{display:flex;gap:10px;padding:7px 14px;border-top:1px solid var(--line);font-size:15px}
.d i{flex:none;width:74px;font-style:normal;color:var(--mut);font-size:13px}
.d i small{display:block}
.d span{border-inline-start:4px solid transparent;padding-inline-start:8px}
.a span{border-color:var(--pri)}.n span{border-color:var(--blue)}.q span{border-color:var(--gold)}
.e span{color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:16px}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line)}th{background:var(--pri2);color:var(--pri)}
h2{font-size:20px;margin:22px 0 0}
.ls{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 16px 14px}
.ls summary{cursor:pointer;font-size:22px;font-weight:800;padding:10px 0;color:var(--pri)}
.ls summary small{display:block;font-size:14px;font-weight:400;color:var(--mut)}
.ls h2{font-size:18px;color:var(--pri)}.ls li{margin-bottom:4px}
.ls td.no{color:var(--gold)}.ls td:first-child{width:56px;text-align:center}
.sc{overflow-x:auto}.ls .sc table{min-width:560px}
[hidden]{display:none}
</style></head><body>

function acts(){const a=D.acts.filter(x=>x.program),c=k=>a.filter(x=>x.bus&&x.bus.includes(k)).length;
let h=`<div class="stats"><span>${a.length} أسبوعًا</span><span>الباص خارجي: ${c('خارجي')}</span></div>`;
D.acts.forEach(x=>{if(x.brk){h+=`<div class="brk">${E(x.brk)}</div>`;return}
const t=dm(x.date),k=x.program.includes('اوف')?'off':x.program.includes('قراني')?'quran':'';
h+=`<div class="act ${k}"><div class="dt"><b>${t.d}</b><small>${t.m}</small></div><div><span class="wkb">الأسبوع ${E(x.week)}</span><h3>${E(x.program.replace('اوف','أوف'))}</h3><p>${t.w}</p>${x.note?`<p>${E(x.note)}</p>`:''}${x.bus&&!x.bus.includes('اوف')&&!x.bus.includes('داخلي')?`<span class="tag">الباص: ${E(x.bus)}</span>`:''}</div></div>`});
return h}
function stage(k){const s=D.stages[k],skip=[];let h='<div class="grid">';
s.weeks.forEach(w=>{if(!w.days.some(d=>d.t)){skip.push(w.label.replace('الأسبوع ',''));return}
h+=`<div class="wk"><h3>${E(w.label)}</h3>`;
w.days.forEach(d=>{const t=dm(d.date),c=!d.t?'e':d.t.includes('الاداب')?'a':d.t.includes('علمني')||d.t.includes('الوجود')?'q':'n';
h+=`<div class="d ${c}"><i>${d.d}<small>${t.d} ${t.m}</small></i><span>${d.t?E(d.t):'—'}</span></div>`});h+='</div>'});
h+='</div>';
return (skip.length?`<p class="note">بلا دروس مقررة: الأسابيع ${skip.join('، ')}</p>`:'')+h+
(s.src.length?`<h2>مصادر الدروس</h2><table><tr><th>الدرس</th><th>المصدر</th></tr>${s.src.map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td></tr>`).join('')}</table>`:'')}

const L={goal:'أن يعيش الطالب قصة الوجود كاملة، من بدء الخلق إلى المصير النهائي. يمرّ في رحلته بقصص الأنبياء والسيرة النبوية والمعجزات وعظمة الله، فيخرج بتصوّر متكامل عن الله والكون والإنسان، ويتعلّق قلبه بالقرآن وبالنبي ﷺ.',

['المحور الثاني: قصص الأنبياء (الأسابيع 4–13)','أن يتعلم الطالب من كل نبي قيمة عملية، مثل الصبر والحكمة والتوكل والعفو والإخلاص في الدعاء.',[[4,'نوح والسفينة',A],[5,'هود ولوط',A],[6,'إبراهيم وتحطيم الأصنام والنار',A],[7,'إبراهيم وإسماعيل وهاجر، وبناء الكعبة وزمزم',A],[8,'يوسف',A],[9,'موسى: الولادة والنشأة في قصر فرعون',A],[10,'موسى وفرعون: العصا والسحرة وانشقاق البحر',A],[11,'داود وسليمان',A],[12,'يونس والحوت',A],[13,'عيسى: الولادة والمعجزات',A]]],

function adab(){const ws=D.stages['وسطى'].weeks,rows=[];ws.forEach((w,i)=>{const d=w.days.find(x=>x.t&&x.t.includes('الاداب'));if(d){const t=dm(d.date);rows.push(`<tr><td><b>${i+1}</b></td><td>${t.w} ${t.d} ${t.m}</td><td class="no">يُحدد لاحقًا</td></tr>`)}});

const AS={'الله':['الفاتحة 1، البقرة 255، الحشر 22–24، مريم 65','أنه الاسم الجامع، ومعنى الإلوهية، وارتباطه بالتوحيد'],'الرحمن':['الفاتحة 3، طه 5، الفرقان 59، سورة الرحمن','سعة الرحمة العامة، وأن الاسم خاص بالله'],'الرحيم':['الأحزاب 43، التوبة 128، وحديث «الله أرحم بعباده من هذه بولدها» (متفق عليه)','رحمته الخاصة بالمؤمنين، والفرق بينه وبين الرحمن'],'الملك':['الحشر 23، الناس 2، طه 114، الفاتحة 4','كمال التصرف والتدبير، وأثره في التوكل والخضوع'],'القدوس':['الحشر 23، الجمعة 1، ودعاء «سبوح قدوس رب الملائكة والروح» (مسلم)','تنزيهه عن النقص والعيب، والتسبيح والتعظيم'],'السلام':['الحشر 23، يونس 25، وحديث «اللهم أنت السلام ومنك السلام» (مسلم)','سلامته من النقائص، ومصدر السلام، وأثره في السكينة'],'المؤمن':['الحشر 23','تصديقه لرسله، وإعطاؤه الأمان لعباده'],'المهيمن':['الحشر 23','الرقابة والإحاطة والشهادة، وأثره في المراقبة'],'العزيز':['الحشر 23، فاطر 10، المنافقون 8','أنواع العزة (قوة وامتناع وقهر)، والاعتزاز بالله'],'الجبار':['الحشر 23','معانيه: جبر الكسر، والقهر، والعلو'],'المتكبر':['الحشر 23، وحديث «الكبرياء ردائي…» (مسلم)','كبرياؤه الحق، وذم كبر المخلوق']};
function asma(){const ws=D.stages['وسطى'].weeks,rows=[];ws.forEach((w,i)=>{const d=w.days.find(x=>x.t&&x.t.includes('اسماء الله'));if(d){const n=(d.t.match(/\((.*?)\)/)||[,''])[1].trim(),a=AS[n]||['',''],t=dm(d.date);rows.push(`<tr><td><b>${i+1}</b></td><td>${t.d} ${t.m}</td><td><b>${E(n)}</b></td><td>${E(a[0])}</td><td>${E(a[1])}</td></tr>`)}});
return `<details class="ls" open><summary>أسماء الله الحسنى <small>يوم الإثنين لجميع المراحل، ${rows.length} اسمًا من سورة الحشر (الآية 23)</small></summary>
<h2>الهدف العام</h2><p>تعريف الطالب بربه من خلال أسمائه الحسنى الواردة في سورة الحشر، وتربيته على التعبد لله بمقتضى كل اسم.</p>
<h2>الأهداف التفصيلية</h2><ul><li>أن يعرّف الطالب كل اسم من الأسماء المقررة ويذكر دليله من الكتاب والسنة.</li><li>أن يفهم معنى كل اسم ودلالته على الذات والصفة.</li><li>أن يستحضر أثر الاسم في قلبه وسلوكه.</li><li>أن يعرف الفرق بين الأسماء المتقاربة، مثل الرحمن والرحيم، والقدوس والسلام.</li></ul>
<h2>المصدر</h2><p>كتاب «أسماء الله الحسنى للأطفال»، تأليف: محمد فتحي السي…، كما ورد في جدول المرحلة الوسطى (اسم المؤلف مقطوع في الجدول).</p>

<h2>ملاحظات</h2><ul><li>الأدلة والمحاور اقتراحات مني، فراجع الآيات والأحاديث من مصادرها قبل الاعتماد.</li><li>الأسماء مرتبة على ترتيب ورودها في سورة الحشر، وهذا يسهل ربطها ببعض.</li></ul></details>`}
function tasks(){return `<table><tr><th>المهمة</th><th>المعلم</th></tr>${D.tasks.map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td></tr>`).join('')}</table>`}

document.getElementById('v').innerHTML=k=='acts'?acts():k=='tasks'?tasks():k=='lessons'?lessons():stage(k);history.replaceState(null,'','#'+encodeURIComponent(k))}
